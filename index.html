<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grocery Lines</title>
    <link rel="stylesheet" href="./vendor/maplibre-gl-5.24.0/maplibre-gl.css" />
    <link rel="stylesheet" href="./src/ui/shared/styles.css" />
    <link rel="stylesheet" href="./src/ui/story/story_page.css" />
  </head>
  <body class="story-page">
    <header class="site-masthead">
      <a class="site-brand" href="./">Grocery Lines</a>
      <nav class="site-nav" aria-label="Pages">
        <a class="site-nav-link" href="./" aria-current="page">Story</a>
        <a class="site-nav-link" href="./explore.html">Explore</a>
        <a class="site-nav-link" href="#methodology">Methodology</a>
      </nav>
    </header>

    <main>
      <article class="story">
        <figure id="circle-hero" class="circle-gallery circle-hero" aria-hidden="true"></figure>
        <header class="story-head">
          <p id="story-kicker" class="story-kicker"></p>
          <h1 id="story-title" class="story-title"></h1>
          <p id="story-deck" class="story-deck"></p>
          <p class="story-meta"><span id="story-byline"></span> <span aria-hidden="true">·</span> <span id="story-date"></span></p>
          <div id="story-summary" class="story-summary"></div>
        </header>

        <div class="story-scroll">
          <div class="story-column">
            <div id="story-rail" class="story-rail" aria-hidden="true"></div>
            <div id="story-text" class="story-text"></div>
          </div>
          <div class="story-stage">
            <div class="story-stage-frame" data-stage="map">
              <div id="story-map" class="map story-map" aria-label="Map for the current part of the story"></div>
              <div class="story-panel-backdrop" aria-hidden="true"></div>
              <div id="story-chart" class="story-panel story-chart"></div>
              <div class="map-key story-key">
                <section id="legend" class="legend" aria-live="polite"></section>
              </div>
            </div>
          </div>
          <p id="stage-step" class="stage-step" aria-live="polite"></p>
        </div>

        <section class="story-handoff" aria-label="Closing">
          <figure id="circle-gallery" class="circle-gallery"></figure>
          <div id="story-closing" class="story-closing"></div>
          <a class="story-cta" href="./explore.html">Explore the map <span aria-hidden="true">→</span></a>
        </section>
      </article>

      <section id="methodology" class="methodology story-methodology" aria-label="Methodology"></section>
    </main>

    <div id="loading" class="loading" role="status">
      <p>Loading food places, bus routes and travel times…</p>
    </div>
    <p id="load-error" class="load-error" role="alert" hidden></p>

    <script src="./vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
    <script src="./vendor/pmtiles-4.5.0/pmtiles.js"></script>
    <script type="module" src="./src/story_page.js"></script>
  </body>
</html>
